<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Capimobi — Crie Seu Próprio App de Imóveis</title>
    <meta name="description" content="Monte seu próprio app de imóveis em minutos. Perfeito para corretores, imobiliárias e construtoras. PWA instalável, link na bio e CRM integrado.">
    <meta name="author" content="Capimobi" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://redeimoveisgb.lovable.app/" />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Capimobi" />
    <link rel="apple-touch-icon" href="/pwa-icon-512.png" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/favicon.png">

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Capimobi" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://redeimoveisgb.lovable.app/" />
    
    
    <meta property="og:image" content="https://capimobi001.lovable.app/og-preview.png">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    
    
    <meta name="twitter:image" content="https://capimobi001.lovable.app/og-preview.png">

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Capimobi",
      "url": "https://redeimoveisgb.lovable.app",
      "logo": "https://redeimoveisgb.lovable.app/pwa-icon-512.png",
      "description": "Plataforma para criar seu próprio app de imóveis. Perfeito para corretores, imobiliárias e construtoras.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "BR"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+55-27-99505-5993",
        "contactType": "customer service",
        "availableLanguage": "Portuguese"
      },
      "sameAs": []
    }
    </script>

    <!-- Structured Data - WebSite with Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Capimobi",
      "url": "https://redeimoveisgb.lovable.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://redeimoveisgb.lovable.app/buscar?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
  
  
  
  
  
  
  
  <meta property="og:title" content="Capimobi — Crie Seu Próprio App de Imóveis">
  <meta name="twitter:title" content="Capimobi — Crie Seu Próprio App de Imóveis">
  <meta property="og:description" content="Monte seu próprio app de imóveis em minutos. Perfeito para corretores, imobiliárias e construtoras. PWA instalável, link na bio e CRM integrado.">
  <meta name="twitter:description" content="Monte seu próprio app de imóveis em minutos. Perfeito para corretores, imobiliárias e construtoras. PWA instalável, link na bio e CRM integrado.">
  <link rel="preload" as="image" href="/pwa-icon-512.png" fetchpriority="high">
  <style>
    #initial-splash {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: #FFFFFF;
      transition: opacity .4s ease;
    }
    #initial-splash.hide { opacity: 0; pointer-events: none; }
    #initial-splash .ring {
      position: absolute; width: 13rem; height: 13rem; border-radius: 9999px;
      border: 4px solid transparent; border-top-color: #00AEEF; border-right-color: rgba(0,174,239,.4);
      animation: spin 1s linear infinite;
    }
    #initial-splash img {
      width: 9rem; height: 9rem; object-fit: contain;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
  </style>
</head>
  <body>
    <div id="initial-splash">
      <div class="ring"></div>
      <img src="/pwa-icon-512.png" alt="Capimobi" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
